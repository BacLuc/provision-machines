name: "Run provisioning on ubuntu"
"on":
  push:
  pull_request:
  schedule:
    - cron: "42 4 * * 0"
  workflow_dispatch:

jobs:
  pyinfra_lint:
    name: "pyinfra lint"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: "install dependencies"
        run: uv sync --frozen --all-extras

      - name: "pytest"
        run: uv run pytest

      - name: "ruff check"
        run: uv run ruff check .

      - name: "mypy"
        run: uv run mypy .

      - name: "run prettier"
        run: |
          # renovate: datasource=docker depName=ghcr.io/bacluc/prettier-image/prettier-image
          prettier_image_version="5.1.1"
          docker run --rm -v $PWD:/workdir -w /workdir -u $UID ghcr.io/bacluc/prettier-image/prettier-image:${prettier_image_version}
          git diff --exit-code

  run_pyinfra:
    name: "Run pyinfra on ubuntu"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: "install dependencies"
        run: uv sync --frozen

      - name: "run pyinfra"
        run: uv run scripts/run_pyinfra_local.py

      - name: "verify goenv in interactive shell"
        run: |
          bash -ic "set -e; command -v goenv; goenv --version; goenv root; goenv init -"
          bash -ic true 2> /tmp/goenv-init.err
          if grep -q '.goenv/bin/goenv' /tmp/goenv-init.err; then
            echo 'interactive shell still references missing $HOME/.goenv/bin/goenv' >&2
            cat /tmp/goenv-init.err >&2
            exit 1
          fi

      - name: "run update-script"
        run: sudo update-script

      - name: "run cleanup-script"
        run: sudo cleanup-script

      - name: "run pyinfra a second time"
        run: uv run scripts/run_pyinfra_local.py
