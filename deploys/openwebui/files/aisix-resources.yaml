_format_version: "1"

provider_keys:
  - display_name: opencode
    provider: opencode
    adapter: openai
    api_base: ${OPENCODE_BASE_URL}
    api_key: ${OPENCODE_API_KEY}

  - display_name: ollama
    provider: ollama
    adapter: openai
    api_base: ${OLLAMA_BASE_URL}
    api_key: ${OLLAMA_API_KEY}

models:
  - display_name: zen-chat
    provider: opencode
    model_name: ${ZEN_MODEL_CHAT}
    provider_key: opencode

  - display_name: ollama-chat
    provider: ollama
    model_name: ${OLLAMA_MODEL_CHAT}
    provider_key: ollama

  - display_name: router-chat
    routing:
      strategy: failover
      targets:
        - model: zen-chat
          priority: 100
        - model: ollama-chat
          priority: -1
      retries: 0
      max_fallbacks: 1
      retry_on_429: true

  - display_name: router-chat-thinking
    routing:
      strategy: failover
      targets:
        - model: zen-chat
          priority: 100
        - model: ollama-chat
