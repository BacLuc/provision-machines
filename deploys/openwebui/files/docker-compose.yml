---
services:
  open-webui:
    image: "ghcr.io/open-webui/open-webui:v0.11.4"
    container_name: "open-webui"
    ports:
      - "127.0.0.1:13307:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "open-webui:/app/backend/data"
    restart: "unless-stopped"
    environment:
      - "WEBUI_AUTH=False"
      - "ENABLE_OPENAI_API=${ENABLE_OPENAI_API}"
      - "OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL}"
      - "OPENAI_API_KEYS=${OPENAI_API_KEYS}"
      - "DEFAULT_MODELS=${DEFAULT_MODELS}"
      - "ENABLE_MODEL_FILTER=${ENABLE_MODEL_FILTER}"
      - "MODEL_FILTER_LIST=${MODEL_FILTER_LIST}"
      - "DATABASE_ENABLE_SESSION_SHARING=true"
  aisix:
    image: "ghcr.io/api7/aisix:${AISIX_VERSION}"
    container_name: "aisix"
    expose:
      - "3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "./aisix-config.yaml:/etc/aisix/config.yaml:ro"
      - "./aisix-resources.yaml:/etc/aisix/resources.yaml:ro"
    restart: "unless-stopped"
    environment:
      - "OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY}"
      - "OLLAMA_API_KEY=${OLLAMA_API_KEY}"
      - "OPENWEBUI_CALLER_KEY=${OPENWEBUI_CALLER_KEY}"
      - "OLLAMA_API_BASE=${OLLAMA_API_BASE}"
      - "ZEN_API_BASE=${ZEN_API_BASE}"
      - "ZEN_MODEL_CHAT=${ZEN_MODEL_CHAT}"
      - "ZEN_MODEL_CHAT_THINKING=${ZEN_MODEL_CHAT_THINKING}"
      - "ZEN_MODEL_WEB_RESEARCH=${ZEN_MODEL_WEB_RESEARCH}"
      - "ZEN_MODEL_TRANSLATE=${ZEN_MODEL_TRANSLATE}"
      - "ZEN_MODEL_FIX_GRAMMAR=${ZEN_MODEL_FIX_GRAMMAR}"
      - "ZEN_MODEL_LINUX_CLI=${ZEN_MODEL_LINUX_CLI}"
      - "OLLAMA_MODEL=${OLLAMA_MODEL}"
  searxng:
    image: ghcr.io/searxng/searxng:2026.2.16-8e824017d
    ports:
      - "127.0.0.1:13308:8080"
    volumes:
      - "searxng-data:/var/cache/searxng/"
      - "./searngx/settings.yml:/etc/searxng/settings.yml:ro"
      - "./searngx/limiter.toml:/etc/searxng/limiter.toml"
    environment:
      SEARXNG_ENABLE_CORS: true
      FORCE_OWNERSHIP: "false"

volumes:
  "open-webui":
    external: true
  searxng-data:
