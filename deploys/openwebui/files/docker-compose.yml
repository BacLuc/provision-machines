---
services:
  open-webui:
    image: "ghcr.io/open-webui/open-webui:v0.11.0"
    container_name: "open-webui"
    ports:
      - "127.0.0.1:13307:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "open-webui:/app/backend/data"
    restart: "unless-stopped"
    environment:
      - "WEBUI_AUTH=False"
  searxng:
    image: ghcr.io/searxng/searxng:2026.2.11-970f2b843
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "127.0.0.1:13308:8080"
    volumes:
      - "searxng-data:/var/cache/searxng/"
      - "./searngx/settings.yml:/etc/searxng/settings.yml"
      - "./searngx/limiter.toml:/etc/searxng/limiter.toml"
    environment:
      SEARXNG_ENABLE_CORS: true
      BRAVE_API_KEY: ${BRAVE_API_KEY}
  valkey:
    image: valkey/valkey:8.1-alpine
    restart: "unless-stopped"
    volumes:
      - "valkey-data:/data"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  "open-webui":
    external: true
  searxng-data:
  valkey-data:
