---
services:
  open-webui:
    image: "ghcr.io/open-webui/open-webui:v0.11.4"
    container_name: "open-webui"
    ports:
      - "127.0.0.1:13307:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "open-webui:/app/backend/data"
    restart: "unless-stopped"
    environment:
      - "WEBUI_AUTH=False"
      - "ENABLE_API_KEYS=true"
      - "ENABLE_OPENAI_API=${ENABLE_OPENAI_API}"
      - "OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL}"
      - "OPENAI_API_KEYS=${OPENAI_API_KEYS}"
      - "DEFAULT_MODELS=${DEFAULT_MODELS}"
      - "ENABLE_MODEL_FILTER=${ENABLE_MODEL_FILTER}"
      - "MODEL_FILTER_LIST=${MODEL_FILTER_LIST}"
      - "DATABASE_ENABLE_SESSION_SHARING=true"
  aisix:
    image: "ghcr.io/api7/aisix:__AISIX_VERSION__"
    container_name: "aisix"
    restart: "unless-stopped"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "./aisix-config.yaml:/etc/aisix/config.yaml:ro"
      - "./aisix-resources.yaml:/etc/aisix/aisix-resources.yaml:ro"
    environment:
      - "OPENWEBUI_CALLER_KEY=${OPENWEBUI_CALLER_KEY}"
      - "ZEN_API_BASE=${ZEN_API_BASE}"
      - "OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY}"
      - "OLLAMA_API_BASE=${OLLAMA_API_BASE}"
      - "OLLAMA_API_KEY=${OLLAMA_API_KEY}"
      - "ZEN_CHAT_MODEL=${ZEN_CHAT_MODEL}"
      - "ZEN_CHAT_THINKING_MODEL=${ZEN_CHAT_THINKING_MODEL}"
      - "ZEN_WEB_RESEARCH_MODEL=${ZEN_WEB_RESEARCH_MODEL}"
      - "ZEN_TRANSLATE_MODEL=${ZEN_TRANSLATE_MODEL}"
      - "ZEN_GRAMMAR_MODEL=${ZEN_GRAMMAR_MODEL}"
      - "ZEN_LINUX_CLI_MODEL=${ZEN_LINUX_CLI_MODEL}"
      - "OLLAMA_CHAT_MODEL=${OLLAMA_CHAT_MODEL}"
      - "OLLAMA_CHAT_THINKING_MODEL=${OLLAMA_CHAT_THINKING_MODEL}"
      - "OLLAMA_WEB_RESEARCH_MODEL=${OLLAMA_WEB_RESEARCH_MODEL}"
      - "OLLAMA_TRANSLATE_MODEL=${OLLAMA_TRANSLATE_MODEL}"
      - "OLLAMA_GRAMMAR_MODEL=${OLLAMA_GRAMMAR_MODEL}"
      - "OLLAMA_LINUX_CLI_MODEL=${OLLAMA_LINUX_CLI_MODEL}"
    networks: [default]
  searxng:
    image: ghcr.io/searxng/searxng:2026.2.16-8e824017d
    ports:
      - "127.0.0.1:13308:8080"
    volumes:
      - "searxng-data:/var/cache/searxng/"
      - "./searngx/settings.yml:/etc/searxng/settings.yml:ro"
      - "./searngx/limiter.toml:/etc/searxng/limiter.toml"
    environment:
      SEARXNG_ENABLE_CORS: true
      FORCE_OWNERSHIP: "false"

volumes:
  "open-webui":
    external: true
  searxng-data:
