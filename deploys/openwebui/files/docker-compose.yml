---
services:
  open-webui:
    image: "ghcr.io/open-webui/open-webui:v0.11.4"
    container_name: "open-webui"
    ports:
      - "127.0.0.1:13307:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "open-webui:/app/backend/data"
    restart: "unless-stopped"
    environment:
      - "WEBUI_AUTH=False"
      - "ENABLE_OPENAI_API=${ENABLE_OPENAI_API}"
      - "OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL}"
      - "OPENAI_API_KEYS=${OPENAI_API_KEYS}"
      - "DEFAULT_MODELS=${DEFAULT_MODELS}"
      - "DATABASE_ENABLE_SESSION_SHARING=true"
  litellm:
    image: "ghcr.io/berriai/litellm:${LITELLM_VERSION}"
    container_name: "litellm"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "./litellm-config.yaml:/app/config.yaml:ro"
    command: ["--config", "/app/config.yaml"]
    restart: "unless-stopped"
    environment:
      - "LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}"
      - "OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY}"
      - "OLLAMA_API_KEY=${OLLAMA_API_KEY}"
      - "OLLAMA_API_BASE=${OLLAMA_API_BASE}"
      - "ZEN_API_BASE=${ZEN_API_BASE}"
      - "ZEN_CHAT_MODEL=${ZEN_CHAT_MODEL}"
      - "ZEN_CHAT_THINKING_MODEL=${ZEN_CHAT_THINKING_MODEL}"
      - "ZEN_WEB_RESEARCH_MODEL=${ZEN_WEB_RESEARCH_MODEL}"
      - "ZEN_TRANSLATE_DE_MODEL=${ZEN_TRANSLATE_DE_MODEL}"
      - "ZEN_TRANSLATE_EN_MODEL=${ZEN_TRANSLATE_EN_MODEL}"
      - "ZEN_FIX_GRAMMAR_EN_MODEL=${ZEN_FIX_GRAMMAR_EN_MODEL}"
      - "ZEN_FIX_GRAMMAR_DE_MODEL=${ZEN_FIX_GRAMMAR_DE_MODEL}"
      - "ZEN_LINUX_CLI_MODEL=${ZEN_LINUX_CLI_MODEL}"
      - "OLLAMA_MODEL=${OLLAMA_MODEL}"
  searxng:
    image: ghcr.io/searxng/searxng:2026.2.16-8e824017d
    ports:
      - "127.0.0.1:13308:8080"
    volumes:
      - "searxng-data:/var/cache/searxng/"
      - "./searngx/settings.yml:/etc/searxng/settings.yml:ro"
      - "./searngx/limiter.toml:/etc/searxng/limiter.toml"
    environment:
      SEARXNG_ENABLE_CORS: true
      FORCE_OWNERSHIP: "false"

volumes:
  "open-webui":
    external: true
  searxng-data:
