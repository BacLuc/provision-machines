model_list:
  - model_name: router-chat
    litellm_params:
      model: os.environ/ZEN_CHAT_MODEL
      api_base: os.environ/ZEN_API_BASE
      api_key: os.environ/OPENCODE_GO_API_KEY
      order: 1
